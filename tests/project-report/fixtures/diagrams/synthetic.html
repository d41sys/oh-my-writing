<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Synthetic diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root { --paper: #fafafa; --ink: #202020; }
    body { font-family: 'Geist', sans-serif; color: var(--ink); background: var(--paper); padding: 3rem; }
    h1 { font-size: 2rem; }
    .card { border: 1px solid #ccc; }
    .frame { max-width: 1200px; }
    svg { width: 100%; min-width: 760px; display: block; }
    svg .zone { fill: var(--paper); stroke: var(--ink); }
    .label { font-size: 12px; fill: var(--ink); }
    #pattern-box { stroke: red; }
    @media print { .card { display: none; } .label { font-size: 10px; } }
    @media (max-width: 700px) { .card { padding: 0; } }
    @keyframes spin { to { transform: rotate(1turn); } }
  </style>
  <script>window.evil = 1;</script>
</head>
<body>
  <div class="frame">
    <h1>Synthetic</h1>
    <svg viewBox="0 0 400 200" width="400" height="200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="syn-title syn-desc" onclick="evil()">
      <title id="syn-title">Synthetic budget diagram</title>
      <desc id="syn-desc">Two boxes showing 120 and 45.</desc>
      <defs><pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1"/></pattern></defs>
      <script>alert(1)</script>
      <rect id="pattern-box" class="zone" x="10" y="10" width="150" height="80" fill="url(#dots)" onmouseover="x()"/>
      <text class="label" x="20" y="50">Budget 120</text>
      <text class="label" x="220" y="50">Spent 45</text>
      <text class="label" x="220" y="90">Forecast 999</text>
      <foreignObject x="0" y="0" width="10" height="10"><div>hidden</div></foreignObject>
      <a href="javascript:alert(2)"><text x="10" y="150">link</text></a>
    </svg>
    <div class="card">card text</div>
  </div>
</body>
</html>
